# Planning only: no AMCL, controller, sensors, or movement.
map_server:
  ros__parameters:
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true
      allow_unknown: false
      tolerance: 0.05

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      # Represents the PROGRAMMED start; not a live robot localisation frame.
      robot_base_frame: planning_start
      resolution: 0.05
      robot_radius: 0.22  # Launch overrides from course_letters.yaml.
      footprint_padding: 0.0
      track_unknown_space: true
      update_frequency: 2.0
      publish_frequency: 1.0
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 5.0
