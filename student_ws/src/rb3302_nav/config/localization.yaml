# Localisation only. Real robot: robot_init supplies drivers and sensor TF.
# Simulation: a simulator must supply scan, odometry/TF and (if used) /clock.
# RViz by itself only displays data; it does not supply simulated sensors.
amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    tf_broadcast: true   # AMCL owns map -> odom.
    set_initial_pose: false  # First test: RViz's 2D Pose Estimate.
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    # Nav2 reference starting values, not tuned for this robot.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map

# Copied sensor selections from planning_rpp/launch/planning.launch.py.
ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 50.0
    sensor_timeout: 0.30
    two_d_mode: true
    transform_timeout: 0.10
    publish_tf: true  # EKF owns odom -> base_link.
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom/raw
    odom0_config: [false, false, false, false, false, false,
                   true, false, false, false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 5.0
    odom0_twist_rejection_threshold: 5.0
    imu0: /imu_data_ros
    imu0_config: [false, false, false, false, false, true,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false
    imu0_pose_rejection_threshold: 5.0
    imu0_twist_rejection_threshold: 5.0
