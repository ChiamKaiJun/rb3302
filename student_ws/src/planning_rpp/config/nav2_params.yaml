amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.8
    alpha2: 0.8
    alpha3: 0.8
    alpha4: 0.8
    alpha5: 0.8
    update_min_d: 0.02 ## added 26 oct, tried & tested, keep 0.05 
    update_min_a: 0.02 ## added 26 oct, tried & tested, keep 0.05

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    publish_zero_velocity: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      # Keep the plugin interface, but disable movement-based progress failures.
      plugin: planning_rpp::NoProgressChecker
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10 ## 26 oct
      # Arrive aligned with the final path segment and stopped before the waypoint wait.
      yaw_goal_tolerance: 0.15 # radians, about 2.9 degrees
      stateful: True ## 26 oct
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.20
      lookahead_dist: 0.20   ## 27 oct, 0.6 -> 0.3
      #min_lookahead_dist: 0.15 #0.3
      #max_lookahead_dist: 0.25 #0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 2.5 # rad/s, target speed for in-place heading turns
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true ## 2 nov, true -> false -> true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true ## 27 oct, false -> true -> false -> true
      use_cost_regulated_linear_velocity_scaling: false ## 2 nov, true -> false -> true
      regulated_linear_scaling_min_radius: 0.10
      regulated_linear_scaling_min_speed: 0.05
      allow_reversing: false
      use_rotate_to_heading: true
      stateful: true # Finish the arrival heading once XY tolerance is reached.
      rotate_to_heading_min_angle: 1.5 ## 2 nov, 0.785 -> 0.2 -> 0.875
      max_angular_accel: 20.0 # rad/s^2, matched to the velocity smoother

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      #width: 3
      #height: 3
      resolution: 0.05
      # footprint is a square of 0.01m x 0.01m, plus 0.1m padding, for a total footprint of 0.21m
      # robot size if around 20cm x 20cm
      #footprint: "[[-0.005, -0.005], [0.005, -0.005], [0.005, 0.005], [-0.005, 0.005]]" ## KJ incresae size 26 oct, all values changed in magnitude from 0.025 t0 0.10, 27 oct, all values changed back to magnitude of 0.025      
      footprint: "[[-0.10, -0.10], [0.10, -0.10], [0.10, 0.10], [-0.10, 0.10]]"
      #footprint_padding: 0.1 ## 26 oct 0.04 + 0.01 + 0.01 = 0.06cm
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30 # metres, match the global costmap's wall-clearance field
        cost_scaling_factor: 6.0 # gentler cost decay to discourage wall-hugging paths
      always_send_full_costmap: true

global_costmap:  ## for astar 
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # global cost map take a larger footprint compared to local costmap
      # footprint plus padding is 23cm x 23cm
      footprint: "[[-0.10, -0.10], [0.10, -0.10], [0.10, 0.10], [-0.10, 0.10]]"
      # footprint: "[[-0.005, -0.005], [0.005, -0.005], [0.005, 0.005], [-0.005, 0.005]]" ## 26 oct, all values changed in magnitude from 0.025 t0 0.10, 27 oct, all values changed back to magnitude of 0.025
      footprint_padding: 0.03 ## 26 oct, 27 oct chnaged from 0.1 to 0.0 -> 0.1
      track_unknown_space: true # current footprint size is 0.005m+0.005m+0.1m+0.1m = 0.21m 
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25 # metres, match the local costmap
        cost_scaling_factor: 6.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      use_astar: true
      # Use the direction of the final path segment, rather than the goal arrow.
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    max_velocity: [0.3, 0.0, 3.0] # chnaged 3rd value 
    min_velocity: [-0.3, 0.0, -3.0] # changed 3rd value
    max_accel: [1.0, 0.0, 6.0] # previously 0.5,0.0,4.5
    max_decel: [-1.0, 0.0, -6.0] # previously -0.5,0.0,-4.5
    odom_topic: /odom
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true

    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 3000 # milliseconds = 3 seconds
