# Provisional 60 cm centre spacing; 6 columns x 4 rows, A-F at the top.
# A is (0,0), using its previous estimated map location as the reference.
# +X points right; +Y points up, so rows below A have negative Y.
# These are nominal targets, not measured centres. Calibrate each physical centre.
# Original map/coordinates, including measured F, are preserved in maps/backups/.
# Old-frame readings must be translated before reuse: x_new=x_old+0.442333,
# y_new=y_old-0.2625. calibrated remains false pending physical verification.
# heading_offset_deg: course EAST relative to map +X (counter-clockwise).
# robot_radius_m: provisional enclosing circle; measure before driving.
map_yaml: rb3302_map.yaml
frame_id: map
calibrated: false
heading_offset_deg: 0.0
robot_radius_m: 0.22
